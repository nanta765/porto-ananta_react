  />

  <!-- Bold, High-Contrast IGBA Lettermark -->
  <text
    x="256"
    y="256"
    text-anchor="middle"
    dominant-baseline="central"
    fill="#243326"
    font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Helvetica, 'Montserrat', Arial, sans-serif"
    font-size="172"
    font-weight="900"
    letter-spacing="-1.5"
